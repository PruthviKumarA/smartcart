# ===== Application Config =====
spring.application.name=order-service
server.port=8081

# ===== Database (H2 for local dev) =====
spring.datasource.url=jdbc:h2:mem:smartcartdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# ===== Redis =====
# Works without Redis — falls back to in-memory cache automatically
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2000ms
spring.data.redis.connect-timeout=2000ms

# ===== Kafka =====
# Works without Kafka — events are silently skipped
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false

# ===== JWT =====
jwt.secret=SmartCartSecretKeyThatIsAtLeast256BitsLongForHS256Algorithm2024
jwt.expiration=86400000

# ===== Async Thread Pool =====
spring.task.execution.pool.core-size=5
spring.task.execution.pool.max-size=10
spring.task.execution.pool.queue-capacity=25
spring.task.execution.thread-name-prefix=smartcart-async-

# ===== Logging =====
logging.level.com.smartcart=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.cache=DEBUG
