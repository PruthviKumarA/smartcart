# ===== Docker Profile =====
# Activated when SPRING_PROFILES_ACTIVE=docker
# Uses real PostgreSQL, Redis, Kafka instead of H2/in-memory

spring.application.name=order-service
server.port=8081

# ===== PostgreSQL =====
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/smartcartdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:smartcart}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:smartcart123}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ===== Redis =====
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=6379
spring.data.redis.timeout=2000ms

# ===== Kafka =====
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false

# ===== JWT =====
jwt.secret=SmartCartSecretKeyThatIsAtLeast256BitsLongForHS256Algorithm2024
jwt.expiration=86400000

# ===== Async Thread Pool =====
spring.task.execution.pool.core-size=5
spring.task.execution.pool.max-size=10
spring.task.execution.pool.queue-capacity=25
spring.task.execution.thread-name-prefix=smartcart-async-

# ===== Logging =====
logging.level.com.smartcart=INFO
logging.level.org.springframework.security=WARN
logging.level.org.springframework.cache=INFO
